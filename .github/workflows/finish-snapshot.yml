name: Finish Fallen Keep snapshot

on:
  push:
    branches:
      - bootstrap-snapshot

permissions:
  contents: write

jobs:
  finish-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out bootstrap branch
        uses: actions/checkout@v4
        with:
          ref: bootstrap-snapshot
          path: bootstrap
          fetch-depth: 0

      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          path: repo
          fetch-depth: 0

      - name: Reconstruct authoritative snapshot and verify it
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/fallen-keep-bootstrap
          base64 -d bootstrap/.bootstrap/payload.tgz.b64 > /tmp/bootstrap-payload.tgz
          tar -xzf /tmp/bootstrap-payload.tgz -C /tmp/fallen-keep-bootstrap

          cd repo

          # Restore the remaining backend/test source exactly as supplied in the ZIP.
          tar -xzf /tmp/fallen-keep-bootstrap/nonpublic.tgz

          # Restore the public files from the currently live source snapshot.
          # Every file is checked against the SHA-256 captured from the authoritative ZIP.
          BASE='https://fallen-keep.jacobchapman3.chatgpt.site'
          while read -r expected path; do
            rel="${path#public/}"
            mkdir -p "$(dirname "$path")"
            curl --fail --location --silent --show-error --retry 5 --retry-delay 2 \
              "$BASE/$rel" -o "$path"
            actual="$(sha256sum "$path" | awk '{print $1}')"
            if [ "$actual" != "$expected" ]; then
              echo "Hash mismatch for $path" >&2
              echo "expected $expected" >&2
              echo "actual   $actual" >&2
              exit 1
            fi
          done < /tmp/fallen-keep-bootstrap/public.sha256

          # Prove every byte and path matches the authoritative ZIP before committing.
          sha256sum -c /tmp/fallen-keep-bootstrap/all.sha256
          find . -type f -not -path './.git/*' -printf '%P\n' | sort > /tmp/repo.paths
          sort /tmp/fallen-keep-bootstrap/all.paths > /tmp/expected.paths
          diff -u /tmp/expected.paths /tmp/repo.paths
          test "$(wc -l < /tmp/repo.paths)" -eq 196

      - name: Commit exact snapshot to main
        shell: bash
        run: |
          set -euo pipefail
          cd repo
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No snapshot changes to commit'; exit 1; }
          git commit -m 'chore: snapshot current Fallen Keep v7 build'
          git push origin HEAD:main

      - name: Remove temporary bootstrap branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd repo
          git push origin --delete bootstrap-snapshot || true
