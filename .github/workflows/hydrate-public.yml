public/ui-preview.css
public/ui-preview.mjs
public/unlock-notices.mjs
public/weapon-unlocks.mjs
public/xp-orb.mjs'''.splitlines()
          base=os.environ['FALLEN_KEEP_SITE'].rstrip('/')
          for rel in paths:
              url=base+'/'+rel.removeprefix('public/')
              req=urllib.request.Request(url,headers={'User-Agent':'Fallen-Keep-snapshot-hydrator/1.0'})
              with urllib.request.urlopen(req,timeout=60) as r: data=r.read()
              p=pathlib.Path(rel); p.parent.mkdir(parents=True,exist_ok=True); p.write_bytes(data)
              print(rel,len(data))
          PY
      - name: Commit hydrated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: hydrate Fallen Keep public snapshot"
          git push origin HEAD:snapshot-hydrate-v7
