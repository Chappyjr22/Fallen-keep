      - name: Commit hydrated public snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public
          if git diff --cached --quiet; then
            echo "No public file changes needed"
            exit 0
          fi
          git commit -m "chore: hydrate Fallen Keep public snapshot"
          git push origin HEAD:snapshot-upload-v7
