name: hydrate Fallen Keep snapshot public files
on:
  push:
    branches: [snapshot-upload-v7]
permissions:
  contents: write
jobs:
  hydrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download public snapshot files
        env:
          FALLEN_KEEP_SITE: https://fallen-keep.jacobchapman3.chatgpt.site
        run: |
          python - <<'PY'
          import os, pathlib, urllib.request
          base=os.environ['FALLEN_KEEP_SITE'].rstrip('/')
          for rel in pathlib.Path('snapshot-public-paths.txt').read_text().splitlines():
              if not rel: continue
              url=base+'/'+rel.removeprefix('public/')
              req=urllib.request.Request(url,headers={'User-Agent':'Fallen-Keep-snapshot-hydrator/1.0'})
              with urllib.request.urlopen(req,timeout=60) as r: data=r.read()
              p=pathlib.Path(rel); p.parent.mkdir(parents=True,exist_ok=True); p.write_bytes(data)
              print(rel,len(data))
          PY
      - name: Commit hydrated public snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public
          if git diff --cached --quiet; then
            echo "No public file changes needed"
            exit 0
          fi
          git commit -m "chore: hydrate Fallen Keep public snapshot"
          git push origin HEAD:snapshot-upload-v7
