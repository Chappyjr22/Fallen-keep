          base = os.environ['FALLEN_KEEP_SITE'].rstrip('/')
          for item in manifest:
              rel = item['path']
              live = rel.removeprefix('public/')
              url = base + '/' + live
              req = urllib.request.Request(url, headers={'User-Agent':'Fallen-Keep-snapshot-hydrator/1.0'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  data = response.read()
              digest = hashlib.sha256(data).hexdigest()
              if len(data) != item['size'] or digest != item['sha256']:
                  raise SystemExit(f"Mismatch for {rel}: got size={len(data)} sha256={digest} expected size={item['size']} sha256={item['sha256']}")
              path = pathlib.Path(rel)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
              print(f"verified {rel}")
